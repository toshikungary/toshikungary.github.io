name: sector-flow
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"   # UTC，夏令/冬令美東都覆蓋到
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sector-flow
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install requests pandas lxml
      - run: python fetch_sector_flow.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add sector_flow.json
          git diff --cached --quiet || (git commit -m "sector flow" && git push)
